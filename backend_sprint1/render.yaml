services:
  - type: web
    name: api-sprint1
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "12"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
    plan: free