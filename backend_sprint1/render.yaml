services:
  - type: web
    name: api-sprint1
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      # --- Secretos: se pegan en el dashboard, sync:false los excluye del repo ---
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BRIDGETS_ADMIN_TOKEN
        sync: false

      # --- Configuración no sensible (commiteable) ---
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "12"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"        # 25 MB para subida de archivos
      - key: MAX_REQUEST_BYTES
        value: "31457280"        # 30 MB para body total (multipart overhead incluido)
      - key: LOG_LEVEL
        value: "INFO"

      # --- CORS (opcional: descomenta si añades cliente web en el futuro) ---
      # - key: BRIDGETS_CORS_ORIGINS
      #   value: "https://tu-dominio-cliente.com"

      # --- Videollamadas: STUN/TURN para WebRTC ---
      # STUN gratuito por defecto. CSV para listar varios servidores.
      - key: BRIDGETS_STUN_URLS
        value: "stun:stun.l.google.com:19302"
      # TURN opcional (necesario tras NAT simétrica / firewalls estrictos).
      # Los tres valores deben estar definidos para que el server se anuncie
      # al cliente; si falta alguno, solo se envía STUN.
      # - key: BRIDGETS_TURN_URL
      #   value: "turn:turn.tudominio.com:3478"
      # - key: BRIDGETS_TURN_USER
      #   sync: false
      # - key: BRIDGETS_TURN_CRED
      #   sync: false
